[package]
name = "recovery-lab"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "Apache-2.0"
description = "Passive async health monitoring and opt-in local recovery testing"
publish = ["crates-io"]
repository = "https://github.com/RazieLDG/recovery-lab"
homepage = "https://behoin.tech/"
documentation = "https://docs.rs/recovery-lab"
readme = "README.md"
keywords = ["monitoring", "resilience", "testing", "async", "chaos"]
categories = ["asynchronous", "development-tools::testing", "network-programming"]
include = ["src/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]
default-run = "recovery-lab"
autotests = false

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu"]

[features]
default = []
fault-injection = ["reqwest/blocking", "dep:ctrlc", "dep:tiny_http"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ctrlc = { version = "3.4", features = ["termination"], optional = true }
tiny_http = { version = "0.12", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
tiny_http = "0.12"
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
quick-xml = "0.38"
nix = { version = "0.31", features = ["signal", "process"] }

[[bin]]
name = "recovery-lab"
path = "src/main.rs"
required-features = ["fault-injection"]

[[bin]]
name = "recovery-fixture"
path = "src/bin/recovery-fixture.rs"
required-features = ["fault-injection"]

[[test]]
name = "recovery"
path = "src/integration/recovery.rs"
required-features = ["fault-injection"]

[[test]]
name = "real_toxiproxy"
path = "src/integration/real_toxiproxy.rs"
required-features = ["fault-injection"]

[profile.release]
strip = true
