[package]
name = "recovery-lab"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Bounded local application recovery assertions using Toxiproxy"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
ctrlc = { version = "3.4", features = ["termination"] }

[profile.release]
strip = true
